# 1. 选择来源，再修改对应来源文件中的访问地址。
source: log
source-config: import-log-file.yaml
# 改用 ES 时，上面两行改成：
# source: es
# source-config: import-es.yaml

# 2. 日志格式：dify / langchain / newapi / oneapi / litellm。
adapter: dify
# 日志正文包在外层字段中时填写，例如本地 ES 实验使用 payload。
# payload-field: payload

# 3. 只扫描哪些供应商。默认不筛选；需要时取消注释并修改。
# platform-tag-source: field:platform
# platforms: [volcengine, huaweicloud]
# metadata 中的标签用 metadata:platform；整批单一供应商用 literal:供应商名。

# 4. name 是标准型号；在 aliases 中追加日志里的官方名称或内部别名。
# 单项可加 platform 和 platform-tag-source；不写 platform 表示全局。
models:
  - name: qwen-3.8-2.4t
    aliases: ["Qwen/Qwen3.8-2.4T-A95B", "qwen-2.4t"]
  - name: deepseek-v4.1
    aliases: ["deepseek-ai/DeepSeek-V4.1-Flash"]
  - name: kimi-k3
    aliases: ["moonshotai/Kimi-K3"]
  - name: minimax-m3
    aliases: ["MiniMaxAI/MiniMax-M3"]
  - name: longcat-2.0
    aliases: ["meituan-longcat/LongCat-2.0"]
  - name: glm-5.3
    aliases: ["zai-org/GLM-5.3"]
  - name: mimo-v2.6
    aliases: ["XiaomiMiMo/MiMo-V2.6-Pro-RL"]
  - name: step-3.7
    aliases: ["stepfun-ai/Step-3.7-Flash"]
  - name: hy4-preview
    aliases: ["tencent/Hy4-preview"]
  - name: ling-3.0
    aliases: ["inclusionAI/Ling-3.0-flash"]
  - name: ring-2.6
    aliases: ["inclusionAI/Ring-2.6-1T"]

  - name: qwen3.5-122b
    aliases: ["Qwen/Qwen3.5-122B-A10B", "Qwen3.5-122B-A10B"]
  - name: qwen3.5-397b
    aliases: ["Qwen/Qwen3.5-397B-A17B", "Qwen3.5-397B-A17B"]
  - name: deepseek-v4-pro-0813
    aliases: ["deepseek-ai/DeepSeek-V4-Pro-0813", "DeepSeek-V4-Pro-0813"]
  - name: glm-5.3-flash
    aliases: ["zai-org/GLM-5.3-Flash", "GLM-5.3-Flash"]
  - name: glm-5.2
    aliases: ["zai-org/GLM-5.2", "GLM-5.2"]
  - name: minimax-m2.7
    aliases: ["MiniMaxAI/MiniMax-M2.7", "MiniMax-M2.7"]
  - name: kimi-k2.6
    aliases: ["moonshotai/Kimi-K2.6", "Kimi-K2.6"]
  - name: kimi-k2.7-code
    aliases: ["moonshotai/Kimi-K2.7-Code", "Kimi-K2.7-Code"]

# 通常无需修改。这里的相对路径以本配置文件所在目录为准。
assets: ../assets/tokenizers
# 资产下载源：global 使用 Hugging Face；cn 使用魔搭。只影响 prepare-assets。
asset-source: global
output: ../runs

# 大批量导入：中间数据落盘。此预算不包含 tokenizer 与单条调用的全部内存。
memory-mib: 64
max-records: 0          # 0 不限；正整数限制本次新增读取量
max-record-mib: 8
# 可选续读与持续导入。状态目录保存原文、进度和计算缓存。
# state: ../runs/import-state
# follow: true
# poll-seconds: 30

# 可选：下载缺少尺寸的 URL 图片。默认不联网；目录不填则使用系统临时目录。
image-download:
  enabled: false
  # cache-dir: /tmp/modulo-images
  max-file-bytes: 10485760   # 单张 10 MiB
  max-cache-bytes: 268435456 # 缓存总量 256 MiB
  ttl-seconds: 86400        # 保留 24 小时；每次导入与写入缓存时清理
  # 内网图片库或 DNS 非公网映射时，仅为明确可信的完整域名配置例外，禁止 *。
  # allow-private-hosts: [images.example.com]
