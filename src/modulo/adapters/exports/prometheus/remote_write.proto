// Wire-compatible subset of Prometheus prompb/remote.proto and types.proto.
// Source: https://prometheus.io/docs/specs/prw/remote_write_spec/
// Gauge metadata: https://github.com/prometheus/prometheus/blob/main/prompb/types.proto
// Generate with grpcio-tools 1.76.0; do not hand-edit remote_write_pb2.py.
syntax = "proto3";
package modulo.prometheus;

message WriteRequest {
  repeated TimeSeries timeseries = 1;
  reserved 2;
  repeated MetricMetadata metadata = 3;
}
message TimeSeries {
  repeated Label labels = 1;
  repeated Sample samples = 2;
}
message Label {
  string name = 1;
  string value = 2;
}
message Sample {
  double value = 1;
  int64 timestamp = 2;
}
message MetricMetadata {
  // Prometheus MetricMetadata.GAUGE = 2. Only snapshot gauges are exported.
  int32 type = 1;
  string metric_family_name = 2;
  string help = 4;
}
