# Dedicated synthetic-data lab. Port publishing is restricted to host loopback.
server.host: 0.0.0.0

# Kibana 9 blocks the old internal settings API. Use supported configuration.
# These defaults apply to all spaces in this dedicated lab; the time picker
# remains usable, while these Advanced Settings entries are locked.
uiSettings:
  overrides:
    "timepicker:timeDefaults": '{"from":"2026-09-30T16:00:00.000Z","to":"2026-10-03T16:00:00.000Z"}'
    "dateFormat:tz": Asia/Shanghai
    "defaultRoute": /app/discover
    "defaultColumns": ["@timestamp", "log_source", "model", "scenario", "usage.input_tokens", "request_text"]
