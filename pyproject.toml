[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "modulo-audit"
version = "0.1.0"
description = "Batch log import and local reference token recounting"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
  "duckdb>=1.4,<2",
  "httpx>=0.28,<1",
  "jinja2>=3.1.6,<4",
  "pydantic>=2.12,<3",
  "pyyaml>=6,<7",
  "tiktoken>=0.12,<1",
  "transformers>=4.57,<5",
]

[project.scripts]
modulo = "modulo.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1", "langchain-core>=1,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/modulo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = ["assets: requires prepared official tokenizer assets"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
